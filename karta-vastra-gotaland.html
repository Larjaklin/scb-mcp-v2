<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Västra Götaland – Samhällsservice</title>
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #222; }

    header {
      background: #1a3a6b;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header span { font-size: 0.85rem; opacity: 0.75; }

    #controls {
      background: #fff;
      border-bottom: 1px solid #dde3ec;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.875rem;
      cursor: pointer;
      user-select: none;
    }
    .legend-item input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; }
    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.25);
      display: inline-block;
      flex-shrink: 0;
    }
    .sep { width: 1px; height: 22px; background: #dde3ec; }

    #count-bar {
      margin-left: auto;
      font-size: 0.82rem;
      color: #666;
    }

    #map { height: calc(100vh - 106px); width: 100%; }

    .leaflet-popup-content-wrapper { border-radius: 8px; font-size: 0.87rem; min-width: 200px; }
    .popup-title { font-weight: 700; font-size: 0.98rem; margin-bottom: 5px; }
    .popup-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 7px;
      letter-spacing: .3px;
    }
    .popup-address { color: #444; line-height: 1.4; }
    .popup-org { color: #888; font-size: 0.78rem; margin-top: 5px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Västra Götaland – Samhällsservice</h1>
    <span>Interaktiv karta · Klicka på markör för information</span>
  </div>
</header>

<div id="controls">
  <label class="legend-item">
    <input type="checkbox" id="cb-polis" checked />
    <span class="dot" style="background:#1a3a6b;"></span>

  </label>
  <div class="sep"></div>
  <label class="legend-item">
    <input type="checkbox" id="cb-brand" checked />

  <div class="sep"></div>

    <input type="checkbox" id="cb-vard" checked />
    <span class="dot" style="background:#27ae60;"></span>

  </label>
  <div class="sep"></div>
  <label class="legend-item">
    <input type="checkbox" id="cb-gymn" checked />

function makeIcon(color, emoji) {
  return L.divIcon({
    className: '',
    html: `<div style="
      background:${color};
      color:#fff;
      width:30px;height:30px;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid rgba(255,255,255,0.85);
      box-shadow:0 2px 6px rgba(0,0,0,0.35);
      display:flex;align-items:center;justify-content:center;
    "><span style="transform:rotate(45deg);font-size:14px;">${emoji}</span></div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -32]
  });
}

const brandIcon = makeIcon('#c0392b', '🚒');
const vardIcon  = makeIcon('#27ae60', '🏥');

// ── Lager ─────────────────────────────────────────────────────────────────────

const polisLayer = L.layerGroup();
const brandLayer = L.layerGroup();
const vardLayer  = L.layerGroup();
const gymnLayer  = L.layerGroup();

// Spread overlapping markers in a small circle so they don't hide each other
(function spreadOverlaps() {
  const THRESH = 0.008; // degrees (~600 m) — points closer than this are "same location"
  const RADIUS = 0.012; // degrees (~900 m) spread radius

  const all = [
    ...polisStationer.map(p => ({ p, ds: 'polis' })),
    ...brandStationer.map(p => ({ p, ds: 'brand' })),
    ...vardCentraler .map(p => ({ p, ds: 'vard'  })),
    ...gymnasieSkolor .map(p => ({ p, ds: 'gymn'  })),
  ];

  const visited = new Set();

  all.forEach((item, i) => {
    if (visited.has(i)) return;
    const cluster = [i];
    all.forEach((other, j) => {
      if (j === i || visited.has(j)) return;
      const dlat = item.p.lat - other.p.lat;
      const dlng = item.p.lng - other.p.lng;
      if (Math.sqrt(dlat*dlat + dlng*dlng) < THRESH) cluster.push(j);
    });
const gymnIcon = L.divIcon({
  className: '',
  html: '<div style="width:14px;height:14px;border-radius:3px;background:#8e44ad;border:2px solid #5b2c6f;"></div>',
  iconSize: [14,14], iconAnchor: [7,7], popupAnchor: [0,-8]
});
    if (cluster.length > 1) {
      const step = (2 * Math.PI) / cluster.length;
      cluster.forEach((idx, k) => {
        all[idx].p._lat = all[idx].p.lat + RADIUS * Math.cos(k * step);
        all[idx].p._lng = all[idx].p.lng + RADIUS * Math.sin(k * step) / Math.cos(all[idx].p.lat * Math.PI / 180);
        visited.add(idx);
      });
    }
  });
})();

function addMarkers(data, layer, icon, typeLabel, typeColor) {
  data.forEach(p => {
    const marker = L.marker([p._lat ?? p.lat, p._lng ?? p.lng], { icon });
    marker.bindPopup(`
      <div class="popup-title">${p.namn}</div>
      <div class="popup-badge" style="background:${typeColor}">${typeLabel}</div>
      <div class="popup-address">📍 ${p.adress}</div>
      ${p.org ? `<div class="popup-org">📋 ${p.org}</div>` : ''}
    `);
    marker.addTo(layer);
  });
}

addMarkers(brandStationer, brandLayer, brandIcon, 'Brandstation',  '#c0392b');

addMarkers(gymnasieSkolor,  gymnLayer,  gymnIcon,  'Gymnasieskola', '#8e44ad');

function updateCount() {
  let count = 0;
  if (document.getElementById('cb-polis').checked) count += polisStationer.length;
  if (document.getElementById('cb-brand').checked) count += brandStationer.length;
  if (document.getElementById('cb-vard').checked)  count += vardCentraler.length;
  if (document.getElementById('cb-gymn').checked)  count += gymnasieSkolor.length;
  document.getElementById('visible-count').textContent = count;
}

});

  if (e.target.checked) vardLayer.addTo(map);
gymnLayer.addTo(map); else map.removeLayer(vardLayer);

});

updateCount();
document.getElementById('cb-gymn').addEventListener('change', e => {

  updateCount();
