<!DOCTYPE html>
<html lang="sv">

  <meta charset="UTF-8" />

  <title>Västra Götaland – Samhällsservice</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #222; }

    header {
      background: #1a3a6b;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header span { font-size: 0.85rem; opacity: 0.75; }

    #controls {
      background: #fff;
      border-bottom: 1px solid #dde3ec;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.875rem;
      cursor: pointer;
      user-select: none;
    }
    .legend-item input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; }
    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.25);
      display: inline-block;
      flex-shrink: 0;
    }
    .sep { width: 1px; height: 22px; background: #dde3ec; }

    #count-bar {
      margin-left: auto;
      font-size: 0.82rem;
      color: #666;
    }

    #map { height: calc(100vh - 106px); width: 100%; }

    .leaflet-popup-content-wrapper { border-radius: 8px; font-size: 0.87rem; min-width: 200px; }
    .popup-title { font-weight: 700; font-size: 0.98rem; margin-bottom: 5px; }
    .popup-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 7px;
      letter-spacing: .3px;
    }
    .popup-address { color: #444; line-height: 1.4; }
    .popup-org { color: #888; font-size: 0.78rem; margin-top: 5px; }
  </style>
</head>

  <div class="sep"></div>

// ── Karta ─────────────────────────────────────────────────────────────────────

const map = L.map('map').setView([58.1, 12.5], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

// ── Ikoner ────────────────────────────────────────────────────────────────────

function makeIcon(color, emoji) {
  return L.divIcon({
    className: '',
    html: `<div style="
      background:${color};
      color:#fff;
      width:30px;height:30px;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid rgba(255,255,255,0.85);
      box-shadow:0 2px 6px rgba(0,0,0,0.35);
      display:flex;align-items:center;justify-content:center;
    "><span style="transform:rotate(45deg);font-size:14px;">${emoji}</span></div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -32]
  });
}

const polisIcon = makeIcon('#1a3a6b', '🚔');
const brandIcon = makeIcon('#c0392b', '🚒');

// ── Lager ─────────────────────────────────────────────────────────────────────

const polisLayer = L.layerGroup();
const brandLayer = L.layerGroup();

function addMarkers(data, layer, icon, typeLabel, typeColor) {
  data.forEach(p => {
    const marker = L.marker([p.lat, p.lng], { icon });
    marker.bindPopup(`
      <div class="popup-title">${p.namn}</div>
      <div class="popup-badge" style="background:${typeColor}">${typeLabel}</div>
      <div class="popup-address">📍 ${p.adress}</div>
      ${p.org ? `<div class="popup-org">📋 ${p.org}</div>` : ''}
    `);
    marker.addTo(layer);
  });
}

addMarkers(polisStationer, polisLayer, polisIcon, 'Polisstation', '#1a3a6b');
addMarkers(brandStationer, brandLayer, brandIcon, 'Brandstation', '#c0392b');

polisLayer.addTo(map);
brandLayer.addTo(map);

// ── Räkna & uppdatera ─────────────────────────────────────────────────────────

document.getElementById('n-polis').textContent = polisStationer.length;
document.getElementById('n-brand').textContent = brandStationer.length;

function updateCount() {
  let count = 0;
  if (document.getElementById('cb-polis').checked) count += polisStationer.length;
  if (document.getElementById('cb-brand').checked) count += brandStationer.length;
  document.getElementById('visible-count').textContent = count;
}

document.getElementById('cb-polis').addEventListener('change', e => {
  if (e.target.checked) polisLayer.addTo(map); else map.removeLayer(polisLayer);
  updateCount();
});
document.getElementById('cb-brand').addEventListener('change', e => {
  if (e.target.checked) brandLayer.addTo(map); else map.removeLayer(brandLayer);
  updateCount();
});

updateCount();
</script>
